# The clock keeper intentionally holds the shared playback PCM open.
monitor.alsa.properties = { alsa.udev.expose-busy = true }
monitor.alsa.rules = [
  { matches = [ { device.name = "alsa_card.platform-soc_sound" } ]
    actions = { update-props = {
      device.profile-set = "voicedsp-v2.conf"
      device.profile = "off"
      device.restore-profile = false
      api.acp.auto-profile = false
      api.alsa.use-acp = true
      api.alsa.use-ucm = false
      device.description = "Voice DSP+"
    } } }
  { matches = [ { node.name = "alsa_output.platform-soc_sound.voicedsp-output" } ]
    actions = { update-props = {
      node.name = "voicedsp_speaker"
      node.description = "Voice DSP+ Speaker"
      audio.rate = 48000
      audio.format = "S32LE"
      api.alsa.disable-mmap = true
      api.alsa.soft-mixer = true
    } } }
  { matches = [ { node.name = "alsa_input.platform-soc_sound.voicedsp-input" } ]
    actions = { update-props = {
      node.name = "voicedsp_microphone"
      node.description = "Voice DSP+ Microphone"
      audio.rate = 48000
      audio.format = "S32LE"
      api.alsa.disable-mmap = true
      api.alsa.soft-mixer = true
    } } }
]
