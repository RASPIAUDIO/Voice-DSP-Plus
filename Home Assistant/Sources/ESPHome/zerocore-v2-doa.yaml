---
packages:
  baseline: !include zerocore-v2-ux-feedback.yaml
esphome:
  project:
    version: 0.6.46-doa-selected.20261110
sensor:
  - platform: template
    name: XMOS DOA Angle 0
    entity_category: diagnostic
    update_interval: 400ms
    accuracy_decimals: 3
    lambda: |-
      const auto s = id(v2_control).xmos_ui_snapshot();
      if (!s.angles_valid || uint32_t(millis() - s.angles_ms) > 1500) return NAN;
      return s.azimuths[0] * 57.295779513f;
