text_sensor:
  - platform: template
    name: XMOS DOA Geometry
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      const auto s = id(v2_control).xmos_ui_snapshot();
      if (!s.geometry_valid) return std::string("unavailable err=") + std::to_string(s.doa_error);
      char b[220];
      snprintf(b, sizeof(b), "%.4f,%.4f,%.4f;%.4f,%.4f,%.4f;%.4f,%.4f,%.4f;%.4f,%.4f,%.4f",
        s.geometry[0], s.geometry[1], s.geometry[2], s.geometry[3], s.geometry[4], s.geometry[5],
        s.geometry[6], s.geometry[7], s.geometry[8], s.geometry[9], s.geometry[10], s.geometry[11]);
      return std::string(b);
